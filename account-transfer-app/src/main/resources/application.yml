spring:
  application:
    name: secure-transfer-demo
  datasource:
    url: jdbc:h2:file:./data/secure-transfer-demo;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

server:
  port: 8080

demo:
  tokenization:
    # Demo secret only. In a real service this comes from Vault/KMS/env vars.
    secret: change-me-in-real-environments
  security:
    poll-interval-ms: 1000
